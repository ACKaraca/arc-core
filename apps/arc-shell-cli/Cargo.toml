[package]
name = "arc-shell-cli"
description = "The reference headless CLI of the Arc suite: the shared CLI subcommands over the sample document type set."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
arc-app = { workspace = true, features = ["render"] }
arc-base = { workspace = true }
arc-command = { workspace = true, features = ["headless"] }
arc-doc = { workspace = true, features = ["package"] }
arc-gpu = { workspace = true }
arc-shell-sample = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Decodes the PNG files the tests read back.
image = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
