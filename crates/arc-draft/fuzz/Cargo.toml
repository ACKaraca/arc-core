# The fuzz targets of arc-draft, built with `cargo +nightly fuzz` from crates/arc-draft. This
# crate is not a member of the workspace, so the workspace gate never builds it.
[package]
name = "arc-draft-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arc-base = { path = "../../arc-base" }
arc-draft = { path = ".." }
libfuzzer-sys = "0.4"

[[bin]]
name = "stroke_font"
path = "fuzz_targets/stroke_font.rs"
test = false
doc = false
bench = false

# Its own workspace root, separate from the repository workspace.
[workspace]
