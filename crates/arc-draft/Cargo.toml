[package]
name = "arc-draft"
description = "The 2D drafting model of the Arc suite: spaces, curve entities, layers, linetypes, blocks, draw order, appearance resolution, layouts, viewports, styles, text, stroke fonts and display lists."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
arc-base = { workspace = true }
arc-command = { workspace = true }
arc-doc = { workspace = true }
arc-geom = { workspace = true }
image = { workspace = true, optional = true }
parley = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tiny-skia = { workspace = true, optional = true }

[features]
# Outline fonts shaped and laid out with `parley`. Off by default, so the WebAssembly build of the
# crate carries stroke text only; the feature also builds for wasm32-unknown-unknown.
outline-text = ["dep:parley"]
# CPU raster output of plot streams (PNG) with `tiny-skia`. Off by default; builds for
# wasm32-unknown-unknown.
raster = ["dep:tiny-skia", "dep:image"]

[dev-dependencies]
arc-doc = { workspace = true, features = ["package"] }
proptest = { workspace = true }

[lints]
workspace = true
