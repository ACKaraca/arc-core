[package]
name = "arc-winsec"
description = "The Windows security FFI crate (ADR-0017): one safe function that reports whether a file or folder is owned by an administrative principal. Empty on other targets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

# This crate does not inherit the workspace lint table, because `unsafe_code = "forbid"` cannot be
# lowered for one crate while inheriting. It repeats every other workspace lint (keep in sync with
# `[workspace.lints]` in the root manifest) and adds a check that every unsafe block is explained.
[lints.rust]
unsafe_code = "allow"
missing_docs = "deny"
unused_must_use = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
wildcard_imports = "deny"
mem_forget = "deny"
exit = "deny"
cognitive_complexity = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
