[package]
name = "arc-doc"
description = "The document store of the Arc suite: type registry, field descriptors, payload codec, typed stores, snapshots, transactions, relationship rules and the reverse reference index."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The SQLite document package (CORE-DOC-040 and following). Off by default and in the
# WebAssembly build: SQLite is native code.
package = ["dep:rusqlite", "dep:blake3", "dep:fastcdc"]

[dependencies]
arc-base = { workspace = true }
arc-swap = { workspace = true }
blake3 = { workspace = true, optional = true }
fastcdc = { workspace = true, optional = true }
postcard = { workspace = true }
rusqlite = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
