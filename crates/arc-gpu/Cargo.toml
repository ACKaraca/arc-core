[package]
name = "arc-gpu"
description = "The real-time viewport renderer of the Arc suite on wgpu: adapter selection, retained scenes, meshes, exact-width lines, shading modes, picking, highlights, overlays, navigation, incremental extraction, off-thread on-demand viewports and headless rendering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
arc-base = { workspace = true }
arc-doc = { workspace = true }
arc-draft = { workspace = true, optional = true }
arc-geom = { workspace = true }
arc-mesh = { workspace = true }
wgpu = { workspace = true }

[features]
# The shared extractor of `arc-draft` display lists (CORE-GPU-013).
draft = ["dep:arc-draft"]

[dev-dependencies]
arc-command = { workspace = true }
image = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
