[package]
name = "arc-gpu"
description = "The real-time viewport renderer of the Arc suite on wgpu: adapter selection, retained scenes, meshes, exact-width lines, shading modes, picking, highlights, overlays, navigation, incremental extraction, off-thread on-demand viewports and headless rendering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
arc-base = { workspace = true }
arc-doc = { workspace = true }
arc-draft = { workspace = true, optional = true }
arc-geom = { workspace = true }
arc-mesh = { workspace = true }
skrifa = { workspace = true, optional = true }
wgpu = { workspace = true }

[features]
# The shared extractor of `arc-draft` display lists (CORE-GPU-013), with hatches and outline text
# (CORE-GPU-011, CORE-GPU-012).
draft = ["dep:arc-draft", "dep:skrifa"]

[dev-dependencies]
arc-command = { workspace = true }
# The DXF import command of the drafting scenario test.
arc-draft-dxf = { workspace = true }
# Outline text layout for the text tests of the feature `draft`.
arc-draft = { workspace = true, features = ["outline-text"] }
image = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
