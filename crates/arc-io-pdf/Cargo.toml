[package]
name = "arc-io-pdf"
description = "Deterministic SVG and PDF writers for drafting plot streams, with loss reports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
arc-base = { workspace = true }
arc-command = { workspace = true }
arc-io-common = { workspace = true }
arc-draft = { workspace = true }
arc-geom = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# PNG output of `core.draft.plot` through the raster output of `arc-draft`. Off by default;
# builds for wasm32-unknown-unknown.
raster = ["arc-draft/raster"]

[dev-dependencies]
arc-doc = { workspace = true }
arc-draft = { workspace = true, features = ["raster"] }
arc-draft-dxf = { workspace = true }
image = { workspace = true }
proptest = { workspace = true }
resvg = { workspace = true }

[lints]
workspace = true
