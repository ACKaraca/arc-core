[package]
name = "arc-io-dwg"
description = "Bounded DWG reader over a byte-level wrapper, mapped to the neutral drawing model of arc-io-dxf."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Fixtures written in memory by the wrapped library (`arc_io_dwg::testing`). Off by default and
# not in the WebAssembly build; products enable it in their dev-dependencies.
testing = []

[dependencies]
arc-base = { workspace = true }
arc-io-common = { workspace = true }
arc-io-dxf = { workspace = true }
acadrust = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
