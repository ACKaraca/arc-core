[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Fuzz crates build with cargo-fuzz on a nightly toolchain, outside the workspace gate.
exclude = ["crates/arc-doc/fuzz", "crates/arc-geom/fuzz", "crates/arc-mesh/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/ACKaraca/arc-core"
publish = false

# Third-party versions are pinned once, here. Every crate listed must also appear in
# docs/architecture/technology-baseline.md and in xtask/layers.toml.
[workspace.dependencies]
arc-base = { path = "crates/arc-base" }
arc-geom = { path = "crates/arc-geom" }
arc-doc = { path = "crates/arc-doc" }
arc-mesh = { path = "crates/arc-mesh" }
arc-solve = { path = "crates/arc-solve" }

# Lock-free publication of document snapshots in `arc-doc`; the optional `serde` feature stays off.
arc-swap = { version = "1.9.5", default-features = false }
glam = "0.34"
# Snapshot tests only; default features (terminal colors) stay off.
insta = { version = "1.49", default-features = false }
nalgebra = { version = "0.35", default-features = false, features = ["std", "serde-serialize"] }
# `alloc` only: payloads are written to vectors; the embedded defaults stay off.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }
robust = "1.2"
# Default features are empty; `serde`/`mint` stay off.
rstar = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
# Constrained Delaunay triangulation behind `arc_geom::triangulate`; `std` only, `mint` and
# `serde` stay off.
spade = { version = "2.15", default-features = false, features = ["std"] }
# `float_roundtrip`: a number read back from JSON is the number that was written.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
toml = "1"
uuid = { version = "1.29", default-features = false, features = ["std", "serde"] }

# The suite lint table (arc-suite docs/engineering/coding-standards.md). Every crate inherits it
# with `[lints] workspace = true`; `cargo xtask layers` fails a crate that does not.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
# No-panic policy (tests are exempted in clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Diagnostics output.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# Hygiene.
wildcard_imports = "deny"
mem_forget = "deny"
exit = "deny"
# Complexity.
cognitive_complexity = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"
# Casting.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
