[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# Fuzz crates build with cargo-fuzz on a nightly toolchain, outside the workspace gate.
exclude = ["crates/arc-doc/fuzz", "crates/arc-geom/fuzz", "crates/arc-mesh/fuzz", "crates/arc-draft/fuzz", "crates/arc-io-dxf/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/ACKaraca/arc-core"
publish = false

# Third-party versions are pinned once, here. Every crate listed must also appear in
# docs/architecture/technology-baseline.md and in xtask/layers.toml.
[workspace.dependencies]
arc-base = { path = "crates/arc-base" }
arc-geom = { path = "crates/arc-geom" }
arc-doc = { path = "crates/arc-doc" }
arc-mesh = { path = "crates/arc-mesh" }
arc-solve = { path = "crates/arc-solve" }
arc-command = { path = "crates/arc-command" }
arc-draft = { path = "crates/arc-draft" }
arc-draft-dxf = { path = "crates/arc-draft-dxf" }
arc-app = { path = "crates/arc-app" }
arc-shell-sample = { path = "crates/arc-shell-sample" }
arc-gpu = { path = "crates/arc-gpu" }
arc-ui = { path = "crates/arc-ui" }
arc-io-dxf = { path = "crates/arc-io-dxf" }
arc-io-pdf = { path = "crates/arc-io-pdf" }
arc-io-mesh = { path = "crates/arc-io-mesh" }
arc-io-common = { path = "crates/arc-io-common" }
arc-io-ifc = { path = "crates/arc-io-ifc" }
arc-io-dwg = { path = "crates/arc-io-dwg" }
arc-winsec = { path = "crates/arc-winsec" }

# DWG reading in `arc-io-dwg`, wrapped behind a byte-level API; the default `parallel` feature
# (rayon) stays off, the optional `import`, `serde` and `parallel` features stay off.
acadrust = { version = "0.6.8", default-features = false }

# Lock-free publication of document snapshots in `arc-doc`; the optional `serde` feature stays off.
arc-swap = { version = "1.9.5", default-features = false }
# Payload and package verification hashes of `arc-doc` (feature `package`); the default `std`
# feature stays off, the hash needs only `core`.
blake3 = { version = "1.8.7", default-features = false }
# Content-defined chunking of large assets in `arc-doc` (feature `package`); the async
# integrations (`tokio`, `futures`) stay off.
fastcdc = { version = "5.0.0", default-features = false }
# The renderer integration of the windowed shell in `arc-app` (feature `window`): the egui
# renderer on the shared `wgpu` device; default features (the `wgpu` defaults, WebGL) stay off.
egui-wgpu = { version = "0.37.0", default-features = false }
# The event translation of the windowed shell in `arc-app` (feature `window`); clipboard, links
# and AccessKit stay off.
egui-winit = { version = "0.37.0", default-features = false }
# Message formatting for the localization of `arc-app`; default features stay off.
fluent-bundle = { version = "0.16.0", default-features = false }
# The immediate-mode widget toolkit of `arc-ui`, with its AccessKit tree; default features (the
# bundled fonts, under a font license outside the allowlist) stay off.
egui = { version = "0.37.0", default-features = false }
glam = "0.34"
# PNG reference images in the `arc-gpu` tests and PNG output of the reference CLI; every other
# format stays off.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Snapshot tests only; default features (terminal colors) stay off.
insta = { version = "1.49", default-features = false }
# Raw deflate decompression in `arc-io-common` (the ZIP entry reader), with the streaming API that
# caps the output; the `with-alloc` feature (no dependencies) is on, `simd` and `std` stay off.
# Already in the lock through `flate2`.
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
# Native menu bars of the windowed shell in `arc-app` (feature `window`, macOS only);
# the GTK backends stay off.
muda = { version = "0.21.2", default-features = false }
nalgebra = { version = "0.35", default-features = false, features = ["std", "serde-serialize"] }
# Outline text shaping and layout in `arc-draft` (feature `outline-text`); `std` only: no system
# font discovery, no `libm`.
parley = { version = "0.12.0", default-features = false, features = ["std"] }
# `alloc` only: payloads are written to vectors; the embedded defaults stay off.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }
# Pull parser behind the XML reader of `arc-io-common`; default features (encoding tables, serde,
# async) stay off, so the parser reads UTF-8 bytes only. Already in the lock.
quick-xml = { version = "0.41.0", default-features = false }
robust = "1.2"
# Outline reading in `arc-gpu` (feature `draft`): glyph outlines of the fonts a font provider supplies;
# `std` only, no autohinting. Already in the lock through `parley`.
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
# Native file dialogs of the windowed shell in `arc-app` (feature `window`): the desktop portal on
# Linux, no GTK and no Wayland parent handle.
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
# Icon rasterization in `arc-ui`; text, system fonts, compressed SVG and raster images stay off.
resvg = { version = "0.49.0", default-features = false }
# CPU rasterization of plot streams in `arc-draft` (feature `raster`); `std` only: no PNG codec
# (the `image` crate writes PNG), no SIMD paths.
tiny-skia = { version = "0.12.0", default-features = false, features = ["std"] }
# Default features are empty; `serde`/`mint` stay off.
rstar = { version = "0.14", default-features = false }
# Directory-relative opens without following links behind the file roots of `arc-command` (Unix
# only); `std` and `fs` only.
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }
# JSON Schema (draft 2020-12) generation from command parameter types in `arc-command`; `std`
# and every optional integration stay off.
schemars = { version = "1.2.3", default-features = false, features = ["derive"] }
# The document package of `arc-doc` (feature `package`): SQLite compiled from the bundled source;
# the default prepared-statement cache stays off.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "limits"] }
serde = { version = "1", features = ["derive"] }
# Constrained Delaunay triangulation behind `arc_geom::triangulate`; `std` only, `mint` and
# `serde` stay off.
spade = { version = "2.15", default-features = false, features = ["std"] }
# `float_roundtrip`: a number read back from JSON is the number that was written.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
toml = "1"
# Structured logging in `arc-app`; the attribute macros and every optional integration stay off.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# Formatting and writing of log records in `arc-app`; ansi colors, filters and JSON stay off.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "registry"] }
# Locale identifiers in `arc-app`; the macro crate and the likely-subtags data stay off.
unic-langid = { version = "0.9.6", default-features = false }
# The renderer of `arc-gpu`: Vulkan, Metal and DirectX 12, the OpenGL fallback and WGSL only; no
# browser, shader-translation or tracing features. Pinned because products use the re-export.
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "metal", "dx12", "gles"] }
# Windows and the event loop of the windowed shell in `arc-app` (feature `window`): X11 and
# Wayland loaded at run time, Wayland decorations without title text (no font crate).
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
uuid = { version = "1.29", default-features = false, features = ["std", "serde"] }
# Owner of the administrator settings file in `arc-winsec`, Windows only: the three features of the
# calls it makes, nothing else.
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

# The suite lint table (arc-suite docs/engineering/coding-standards.md). Every crate inherits it
# with `[lints] workspace = true`; `cargo xtask layers` fails a crate that does not.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
# No-panic policy (tests are exempted in clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Diagnostics output.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# Hygiene.
wildcard_imports = "deny"
mem_forget = "deny"
exit = "deny"
# Complexity.
cognitive_complexity = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"
# Casting.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
