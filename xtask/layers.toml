# The layer table (ADR-0001). `cargo xtask layers` checks the workspace against it.
# Changing this file needs an architecture decision record.

# Crates that nothing in L0-L4 may reach through normal dependencies.
ui_deny = [
  "winit",
  "wgpu",
  "egui",
  "eframe",
  "egui_dock",
  "accesskit",
  "muda",
  "rfd",
  "raw-window-handle",
]

# Crates that cannot build for wasm32-unknown-unknown. A crate of the `wasm` set below must not
# reach any of them through normal dependencies.
wasm_deny = [
  "rusqlite",
  "libsqlite3-sys",
  "zstd",
  "zstd-sys",
  "cxx",
  "tokio",
  "reqwest",
  "minidumper",
  "crash-handler",
  "sentry",
]

# Third-party crates a workspace crate may depend on directly. Mirrors the crates of
# docs/architecture/technology-baseline.md that are in use.
third_party = [
  "acadrust",
  "arc-swap",
  "blake3",
  "egui",
  "egui-wgpu",
  "egui-winit",
  "fastcdc",
  "fluent-bundle",
  "glam",
  "image",
  "insta",
  "interprocess",
  "miniz_oxide",
  "muda",
  "nalgebra",
  "parley",
  "postcard",
  "proptest",
  "quick-xml",
  "resvg",
  "rfd",
  "robust",
  "rstar",
  "rustix",
  "schemars",
  "rusqlite",
  "serde",
  "skrifa",
  "serde_json",
  "skrifa",
  "spade",
  "thiserror",
  "tiny-skia",
  "toml",
  "tracing",
  "tracing-subscriber",
  "unic-langid",
  "uuid",
  "wgpu",
  "windows-sys",
  "winit",
]

# Crates built for wasm32-unknown-unknown by `cargo xtask wasm`.
wasm = ["arc-base", "arc-geom", "arc-doc", "arc-mesh", "arc-solve", "arc-command", "arc-draft", "arc-ui", "arc-io-dxf", "arc-io-pdf", "arc-draft-dxf", "arc-io-mesh", "arc-io-common", "arc-io-ifc", "arc-io-dwg"]

# Class of every workspace crate: layer(n), ffi(n), app, testkit or tool.
[crates]
arc-base = "layer(0)"
arc-geom = "layer(1)"
arc-mesh = "layer(1)"
arc-brep = "layer(2)"
arc-brep-occt = "ffi(2)"
arc-solve = "layer(2)"
arc-doc = "layer(3)"
arc-command = "layer(3)"
arc-draft = "layer(4)"
arc-view = "layer(4)"
arc-scene = "layer(4)"
arc-nodes = "layer(4)"
arc-hub-api = "layer(4)"
arc-io-dxf = "layer(4)"
arc-io-mesh = "layer(4)"
# The IFC reader (CORE-IO-014); its same-layer edge to arc-io-common is recorded in the ADR-0001 amendment.
arc-io-ifc = "layer(4)"
# The DWG reader over the wrapped library (CORE-IO-011); its same-layer edge to arc-io-dxf is recorded in the
# ADR-0001 amendment "DWG reader over a wrapped library".
arc-io-dwg = "layer(4)"
# The shared bounded ZIP and XML readers (ADR-0001, amendment "Shared bounded ZIP and XML readers").
arc-io-common = "layer(4)"
arc-io-pdf = "layer(4)"
# The shared mapping between the neutral DXF model and the drafting model (ADR-0001, amendment
# "Mapping crate between a format crate and the drafting model").
arc-draft-dxf = "layer(4)"
# A library above the domain layers, so both reference shells can depend on it (ADR-0001,
# amendment "Sample set of the reference shell").
arc-shell-sample = "layer(4)"
arc-pdfium = "ffi(4)"
arc-opennurbs = "ffi(4)"
# The Windows security query of the administrator settings file (ADR-0017).
arc-winsec = "ffi(5)"
arc-gpu = "layer(5)"
arc-ui = "layer(6)"
arc-app = "layer(6)"
arc-shell = "app"
arc-shell-cli = "app"
arc-worker = "app"
xtask = "tool"

# Allowed edges between crates of the same layer.
[[same_layer]]
from = "arc-mesh"
to = "arc-geom"

[[same_layer]]
from = "arc-command"
to = "arc-doc"

[[same_layer]]
from = "arc-view"
to = "arc-draft"

[[same_layer]]
from = "arc-io-pdf"
to = "arc-draft"

[[same_layer]]
from = "arc-io-pdf"
to = "arc-draft-dxf"

[[same_layer]]
from = "arc-scene"
to = "arc-io-usd"

[[same_layer]]
from = "arc-app"
to = "arc-ui"

[[same_layer]]
from = "arc-draft-dxf"
to = "arc-draft"

[[same_layer]]
from = "arc-draft-dxf"
to = "arc-io-dxf"

[[same_layer]]
from = "arc-io-ifc"
to = "arc-io-common"

[[same_layer]]
from = "arc-io-dwg"
to = "arc-io-dxf"

# The loss report types and their aggregator are shared by the format crates (ADR-0001, amendment
# "Shared bounded ZIP and XML readers", paragraph "Loss report types"). Each format crate that
# re-exports them records its edge to arc-io-common here.
[[same_layer]]
from = "arc-io-dxf"
to = "arc-io-common"

[[same_layer]]
from = "arc-io-mesh"
to = "arc-io-common"

[[same_layer]]
from = "arc-io-pdf"
to = "arc-io-common"

[[same_layer]]
from = "arc-io-dwg"
to = "arc-io-common"
